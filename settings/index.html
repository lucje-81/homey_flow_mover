<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; color: #222; margin: 0; padding: 12px; }
    h1 { font-size: 19px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
    h2 .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: #2f6fde; color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; }
    .hint { color: #666; margin: 0 0 10px; line-height: 1.4; font-size: 13px; }
    .card { border: 1px solid #e5e5e5; border-radius: 12px; padding: 12px; margin: 12px 0; }
    .card.off { opacity: .45; pointer-events: none; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    input, select, button { font-size: 14px; padding: 7px 9px; border: 1px solid #ccc; border-radius: 7px; background: #fff; color: #222; box-sizing: border-box; }
    input[type=checkbox] { width: auto; padding: 0; margin: 0; }
    button { cursor: pointer; }
    button.primary { background: #2f6fde; border-color: #2f6fde; color: #fff; font-weight: 600; }
    button.small { padding: 4px 9px; font-size: 13px; }
    button[disabled] { opacity: .5; cursor: default; }
    label.chk { display: flex; align-items: center; gap: 7px; font-size: 13px; margin: 5px 0; }
    .status { font-size: 13px; min-height: 18px; }
    .ok { color: #1d6b36; } .err { color: #b00020; } .warn { color: #8a5a00; }
    details.help { font-size: 13px; color: #555; margin: 6px 0 10px; }
    details.help summary { cursor: pointer; color: #2f6fde; }
    details.help ol { margin: 6px 0 0 18px; padding: 0; line-height: 1.5; }
    .dev { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 7px 0; border-bottom: 1px solid #f0f0f0; }
    .dev .nm { flex: 1 1 160px; min-width: 0; }
    .dev .nm b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dev .nm small { display: block; color: #888; font-size: 12px; }
    .dev .nm small.warn { color: #8a5a00; }
    .dev select { flex: 1 1 180px; min-width: 0; max-width: 100%; }
    .dev.missing select { border-color: #e3a3ad; background: #fff5f6; }
    .flow { border-bottom: 1px solid #f0f0f0; padding: 7px 0; }
    .flow .top { display: flex; align-items: center; gap: 8px; }
    .flow .ic { flex: none; width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .ic.g { background: #2f9e44; } .ic.o { background: #e0861d; } .ic.r { background: #d63939; } .ic.s { background: #999; }
    .flow .nm { flex: 1; min-width: 0; }
    .flow .nm b { font-weight: 600; }
    .flow .nm small { display: block; color: #888; font-size: 12px; }
    .tag { font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #eef2fb; color: #2f6fde; margin-left: 4px; white-space: nowrap; }
    .tag.grey { background: #eee; color: #666; }
    .flow ul { margin: 4px 0 0 56px; padding: 0; font-size: 12px; line-height: 1.45; }
    .flow li.e { color: #b00020; } .flow li.w { color: #8a5a00; }
    .bar { position: sticky; bottom: 0; background: #fff; padding: 10px 0 4px; border-top: 1px solid #eee; }
    .result li { font-size: 13px; }
    h3 { font-size: 14px; margin: 12px 0 4px; }
    .miss { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 7px 0; border-bottom: 1px solid #f0f0f0; }
    .miss .nm { flex: 1 1 180px; min-width: 0; }
    .miss .nm b { display: block; }
    .miss .nm small { display: block; color: #888; font-size: 12px; }
    .miss code { font-size: 12px; background: #f4f4f4; padding: 1px 5px; border-radius: 4px; }
    .miss .act { margin-left: auto; }
    .empty { padding: 14px; text-align: center; color: #777; border: 1px dashed #ccc; border-radius: 8px; font-size: 13px; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .filters button.sel { background: #2f6fde; border-color: #2f6fde; color: #fff; }
  </style>
</head>
<body>
  <h1 data-t="title"></h1>
  <p class="hint" data-t="intro"></p>

  <div class="card" id="step1">
    <h2><span class="n">1</span><span data-t="step1"></span></h2>
    <p class="hint" data-t="step1Hint"></p>
    <details class="help"><summary data-t="keyHelp"></summary><ol id="keySteps"></ol></details>
    <div class="row">
      <input id="address" type="text" style="flex:1 1 160px" autocomplete="off">
      <input id="token" type="password" style="flex:2 1 200px" autocomplete="off">
      <button id="connect" class="primary" data-t="connect"></button>
    </div>
    <div class="status" id="connStatus"></div>
    <h3 data-t="targetTitle"></h3>
    <p class="hint" data-t="targetHint"></p>
    <details class="help"><summary data-t="keyHelp"></summary><ol id="targetKeySteps"></ol></details>
    <div class="row">
      <input id="targetToken" type="password" style="flex:1 1 220px" autocomplete="off">
      <button id="connectTarget" class="primary" data-t="save"></button>
    </div>
    <div class="status" id="targetStatus"></div>
  </div>

  <div class="card off" id="stepMissing">
    <h2><span class="n">2</span><span data-t="stepMissing"></span></h2>
    <p class="hint" data-t="stepMissingHint"></p>
    <div class="row"><button id="refresh" class="small" data-t="refresh" style="margin-left:auto"></button></div>
    <h3 data-t="appsTitle"></h3>
    <div id="appList"></div>
    <h3 data-t="systemTitle"></h3>
    <div id="systemList"></div>
    <h3 data-t="versionsTitle"></h3>
    <div id="versionList"></div>
    <h3 data-t="usersTitle"></h3>
    <div id="userList"></div>
    <h3 data-t="varsTitle"></h3>
    <div id="varList"></div>
  </div>

  <div class="card off" id="step2">
    <h2><span class="n">3</span><span data-t="step2"></span></h2>
    <p class="hint" data-t="step2Hint"></p>
    <div class="row">
      <label class="chk"><input id="onlyMissing" type="checkbox"> <span data-t="onlyMissing"></span></label>
      <button id="resetMap" class="small" data-t="resetMap" style="margin-left:auto"></button>
    </div>
    <div id="devList"></div>
  </div>

  <div class="card off" id="stepZones">
    <h2><span class="n">4</span><span data-t="stepZones"></span></h2>
    <p class="hint" data-t="stepZonesHint"></p>
    <div id="zoneSummary" class="status"></div>
    <div id="zoneList"></div>
  </div>

  <div class="card off" id="step3">
    <h2><span class="n">5</span><span data-t="step3"></span></h2>
    <p class="hint" data-t="step3Hint"></p>
    <div class="row"><input id="search" type="search" style="flex:1"></div>
    <div class="filters" id="filters"></div>
    <div class="row">
      <button id="selectReady" class="small" data-t="selectReady"></button>
      <button id="selectNone" class="small" data-t="selectNone"></button>
    </div>
    <div id="flowList"></div>
    <div class="bar">
      <label class="chk"><input id="optEnabled" type="checkbox"> <span data-t="optEnabled"></span></label>
      <label class="chk"><input id="optVars" type="checkbox" checked> <span data-t="optVars"></span></label>
      <label class="chk"><input id="optSkip" type="checkbox" checked> <span data-t="optSkip"></span></label>
      <label class="chk"><input id="optBridge" type="checkbox" checked> <span data-t="optBridge"></span></label>
      <div class="row" id="linkRow" style="margin:2px 0 0 24px;font-size:13px"></div>
      <div class="row" style="margin-top:8px"><button id="migrate" class="primary" disabled></button><span class="status" id="migStatus"></span></div>
    </div>
    <ul class="result" id="result"></ul>
    <details class="help"><summary data-t="diag"></summary><pre id="diag" style="white-space:pre-wrap;font-size:11px;user-select:text"></pre></details>
  </div>

  <div class="card off" id="stepSwitch">
    <h2><span class="n">6</span><span data-t="stepSwitch"></span></h2>
    <p class="hint" data-t="stepSwitchHint"></p>
    <div id="switchList"></div>
  </div>

  <div class="card off" id="stepDash">
    <h2><span class="n">7</span><span data-t="stepDash"></span></h2>
    <p class="hint" data-t="stepDashHint"></p>
    <div id="dashList"></div>
  </div>

  <div class="card off" id="stepFav">
    <h2><span class="n">8</span><span data-t="stepFav"></span></h2>
    <p class="hint" data-t="stepFavHint"></p>
    <div id="favList"></div>
  </div>

  <script type="text/javascript">
    var H;
    var hasTarget = false;
    var data = null;
    var selected = {};
    var filter = 'all';
    var $ = function (id) { return document.getElementById(id); };
    function t(k, v) {
      var s = H.__('settings.' + k);
      if (v) Object.keys(v).forEach(function (n) { s = s.replace('{' + n + '}', v[n]); });
      return s;
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function api(method, path, body) {
      return new Promise(function (resolve, reject) {
        H.api(method, path, body || null, function (err, res) { if (err) reject(err); else resolve(res); });
      });
    }

    function statusOf(f) {
      if (f.exists) return 's';
      if (f.issues.length) return 'r';
      if (f.notes.length) return 'o';
      return 'g';
    }

    // ---- step 1
    function connect() {
      $('connect').disabled = true;
      $('connStatus').className = 'status';
      $('connStatus').textContent = t('connecting');
      api('POST', '/connect', { address: $('address').value, token: $('token').value })
        .then(function (r) {
          $('token').value = '';
          $('token').placeholder = t('tokenSaved');
          $('connStatus').className = 'status ok';
          $('connStatus').textContent = t('connected', { flows: r.flows + r.advancedFlows, devices: r.devices });
          return analyse();
        })
        .catch(function (err) {
          $('connStatus').className = 'status err';
          $('connStatus').textContent = t('connectFailed') + ' ' + (err.message || err);
        })
        .then(function () { $('connect').disabled = false; });
    }

    function analyse() {
      $('flowList').innerHTML = '<div class="empty">' + esc(t('analysing')) + '</div>';
      return api('GET', '/analysis').then(function (r) {
        data = r;
        $('step2').classList.remove('off');
        $('stepMissing').classList.remove('off');
        $('stepZones').classList.remove('off');
        $('stepDash').classList.remove('off');
        $('stepFav').classList.remove('off');
        $('stepSwitch').classList.remove('off');
        loadFavorites();
        loadMoves();
        if (data.flows.some(function (f) { return f.bridge; })) loadLinkTargets();
        renderDashboards();
        renderZones();
        renderMissing();
        $('step3').classList.remove('off');
        var keep = {};
        data.flows.forEach(function (f) { if (selected[f.id]) keep[f.id] = true; });
        selected = keep;
        renderDevices();
        renderFlows();
        $('diag').textContent = JSON.stringify(data.diag || {}, null, 1);
      }).catch(function (err) {
        $('flowList').innerHTML = '<div class="empty err">' + esc(err.message || err) + '</div>';
      });
    }

    // ---- missing apps and variables
    function renderMissing() {
      var apps = data.missingApps || [];
      var showAll = $('appsAll') && $('appsAll').checked;
      var shown = apps.filter(function (a) { return showAll || a.used || a.unmatched; });
      var hidden = apps.filter(function (a) { return !a.used && !a.unmatched; }).length;
      var appRow = function (a) {
        var where = [];
        if (a.flows) where.push(t('usedIn', { n: a.flows }));
        if (a.dashboards) where.push(t('inDashboards', { n: a.dashboards }));
        if (a.devices) where.push(t('appDevices', { n: a.devices }) + (a.linked ? ' (' + t('appLinked', { n: a.linked }) + ')' : ''));
        if (!where.length) where.push(t('appUnused'));
        var act;
        if (a.notOnSource) {
          act = '<small class="act warn" style="flex-basis:100%">' + esc(t('notOnSource', { flows: a.flowNames.join(', ') })) + '</small>';
        } else if (a.origin === 'appstore') {
          act = '<button class="small primary act" data-store="' + esc(a.id) + '" data-channel="' + esc(a.channel) + '">' + esc(t(hasTarget ? 'install' : 'openStore')) + '</button>';
        } else {
          act = '<small class="act warn" style="flex-basis:100%">' + esc(t('cliApp')) + ' <code>homey app install</code></small>';
        }
        var note = a.linked && a.linked === a.devices && !a.flows && !a.dashboards ? '<small class="act" style="flex-basis:100%;color:#888">' + esc(t('appAllLinked')) + '</small>' : '';
        return '<div class="miss"><span class="nm"><b>' + esc(a.name) + '</b><small>' + esc(a.id + (a.channel === 'test' ? ' · test' : '') + ' · ' + where.join(' · ')) + '</small></span>' + act + note + '</div>';
      };
      $('appList').innerHTML = (!shown.length ? '<div class="empty ok">' + esc(t('noMissingApps')) + '</div>' : shown.map(appRow).join(''))
        + (apps.length ? '<label class="chk" style="margin-top:6px"><input id="appsAll" type="checkbox"' + (showAll ? ' checked' : '') + '> <span>' + esc(t('appsShowAll', { n: hidden })) + '</span></label>' : '');
      var sys = data.systemDevices || [];
      if (!sys.length) $('systemList').innerHTML = '<div class="empty ok">' + esc(t('noSystem')) + '</div>';
      else {
        var kinds = [];
        sys.forEach(function (d) { if (kinds.indexOf(d.kind) < 0) kinds.push(d.kind); });
        $('systemList').innerHTML = kinds.map(function (k) {
          var list = sys.filter(function (d) { return d.kind === k; });
          var label = t('sys_' + k) !== 'settings.sys_' + k && t('sys_' + k) !== 'sys_' + k ? t('sys_' + k) : k;
          var help = t('sysHelp_' + k) !== 'settings.sysHelp_' + k && t('sysHelp_' + k) !== 'sysHelp_' + k ? t('sysHelp_' + k) : t('sysHelp_other');
          return '<div style="margin:6px 0 10px"><b>' + esc(label) + '</b> (' + list.length + ')<div class="hint" style="margin:2px 0 4px">' + esc(help) + '</div>'
            + list.map(function (d) {
              var info = [d.zone, d.flows ? t('usedIn', { n: d.flows }) : t('notUsed')];
              if (k === 'group') info.push(t('groupMembers', { found: d.membersFound, total: d.members }));
              return k === 'group'
                ? '<label class="miss"><input type="checkbox" data-group="' + esc(d.id) + '"' + (d.membersFound ? ' checked' : ' disabled') + '><span class="nm"><b>' + esc(d.name) + '</b><small>' + esc(info.filter(Boolean).join(' · ')) + '</small></span></label>'
                : '<div class="miss"><span class="nm"><b>' + esc(d.name) + '</b><small>' + esc(info.filter(Boolean).join(' · ')) + '</small></span></div>';
            }).join('')
            + (k === 'group' ? '<div class="row" style="margin-top:6px"><button id="createGroups" class="small primary">' + esc(t('createGroups')) + '</button><span class="status" id="groupStatus"></span></div>' : '')
            + '</div>';
        }).join('');
      }
      var vers = data.appVersions || [];
      var older = vers.filter(function (v) { return v.older; });
      var newer = vers.filter(function (v) { return !v.older; });
      var vhtml = !older.length ? '<div class="empty ok">' + esc(t('versionsOk')) + '</div>' : older.map(function (v) {
        var act = v.origin === 'appstore'
          ? '<button class="small primary act" data-store="' + esc(v.id) + '" data-channel="' + esc(v.channel) + '">' + esc(t(hasTarget ? 'update' : 'openStore')) + '</button>'
          : '<small class="act warn" style="flex-basis:100%">' + esc(t('cliUpdate')) + ' <code>git pull</code> + <code>homey app install</code></small>';
        return '<div class="miss"><span class="nm"><b>' + esc(v.name) + '</b><small>' + esc(t('versionHere', { here: v.here, there: v.there }) + (v.flows ? ' · ' + t('usedIn', { n: v.flows }) : '')) + '</small></span>' + act + '</div>';
      }).join('');
      if (newer.length) {
        vhtml += '<div class="hint" style="margin-top:6px">' + esc(t('versionsNewer')) + ' ' + newer.map(function (v) { return esc(v.name + ' ' + v.here + ' (' + v.there + ')'); }).join(' · ') + '</div>';
      }
      $('versionList').innerHTML = vhtml;
      var users = data.users || [];
      var others = users.filter(function (u) { return u.role !== 'owner'; });
      $('userList').innerHTML = !others.length ? '<div class="empty">' + esc(t('noUsers')) + '</div>' : others.map(function (u) {
        var info = [t('role_' + u.role) !== 'settings.role_' + u.role && t('role_' + u.role) !== 'role_' + u.role ? t('role_' + u.role) : u.role];
        if (u.flows) info.push(t('usedIn', { n: u.flows }));
        var right;
        if (u.status === 'here') right = '<small class="act ok">' + esc(t('userHere')) + '</small>';
        else if (u.status === 'invited') right = '<small class="act warn" style="flex-basis:100%">' + esc(t('userInvited')) + '</small>'
          + (u.inviteUrl ? '<div class="row" style="flex-basis:100%;margin:2px 0 0"><input readonly value="' + esc(u.inviteUrl) + '" style="flex:1;font-size:12px"><button class="small" data-copy="' + esc(u.inviteUrl) + '">' + esc(t('copy')) + '</button></div>' : '');
        else right = '<input type="checkbox" class="act" data-user="' + esc(u.id) + '" checked>';
        return '<div class="miss"><span class="nm"><b>' + esc(u.name) + '</b><small>' + esc(info.join(' · ')) + '</small></span>' + right + '</div>';
      }).join('') + (others.some(function (u) { return u.status === 'missing'; })
        ? '<div class="row" style="margin-top:8px"><button id="inviteUsers" class="small primary">' + esc(t('inviteUsers')) + '</button><span class="status" id="userStatus"></span></div>' : '');
      var vars = data.missingVariables || [];
      $('varList').innerHTML = !vars.length ? '<div class="empty ok">' + esc(t('noMissingVars')) + '</div>' : vars.map(function (v) {
        return '<label class="miss"><input type="checkbox" data-var="' + esc(v.id) + '"' + (v.flows ? ' checked' : '') + '><span class="nm"><b>' + esc(v.name) + '</b><small>'
          + esc(t('type_' + v.type) + ' · ' + t('value') + ': ' + (v.value === '' || v.value == null ? '–' : v.type === 'boolean' ? t(v.value ? 'yes' : 'no') : String(v.value)) + ' · ' + (v.flows ? t('usedIn', { n: v.flows }) : t('notUsed'))) + '</small></span></label>';
      }).join('') + '<div class="row" style="margin-top:8px"><button id="createVars" class="small primary">' + esc(t('createVars')) + '</button><span class="status" id="varStatus"></span></div>';
    }

    // ---- bridge target (Homey Link) and switching
    var linkTargets = [];
    function loadLinkTargets() {
      api('GET', '/link-targets').then(function (r) {
        linkTargets = r.targets || [];
        var chosen = r.chosen && r.chosen.sessionId;
        if (!linkTargets.length) { $('linkRow').innerHTML = '<span class="warn">' + esc(t('noLinkTargets')) + '</span>'; return; }
        $('linkRow').innerHTML = '<span>' + esc(t('linkTarget')) + '</span> <select id="linkSel">' + linkTargets.map(function (x) {
          return '<option value="' + esc(x.sessionId) + '"' + ((chosen ? chosen === x.sessionId : linkTargets.length === 1) ? ' selected' : '') + '>' + esc(x.title || x.name) + '</option>';
        }).join('') + '</select>';
        if (!chosen && linkTargets.length === 1) api('POST', '/link-target', { target: linkTargets[0] });
      }).catch(function (err) { $('linkRow').innerHTML = '<span class="err">' + esc(err.message || err) + '</span>'; });
    }

    function loadMoves() {
      api('GET', '/moves').then(function (list) {
        if (!list.length) { $('switchList').innerHTML = '<div class="empty">' + esc(t('noMoves')) + '</div>'; return; }
        var pill = function (on, label) {
          if (on === undefined) return '';
          var c = on === null ? '#999' : on ? '#2f9e44' : '#bbb';
          return '<span class="tag" style="background:' + c + ';color:#fff">' + esc(label) + ' ' + (on === null ? '?' : on ? t('on') : t('off')) + '</span>';
        };
        $('switchList').innerHTML = '<div class="row"><button class="small" id="swAll">' + esc(t('selectAll')) + '</button><button class="small" id="swNone">' + esc(t('selectNone')) + '</button><button class="small" id="swRefresh" style="margin-left:auto">' + esc(t('refresh')) + '</button></div>'
          + list.map(function (m) {
            return '<label class="miss"><input type="checkbox" data-move="' + esc(m.id) + '"><span class="nm"><b>' + esc(m.name) + '</b><small>'
              + pill(m.pro, t('proLabel')) + ' ' + pill(m.shs, t('shsLabel')) + ' ' + pill(m.bridge, t('bridgeLabel')) + '</small></span></label>';
          }).join('')
          + '<div class="row" style="margin-top:8px"><button id="swHere" class="small primary">' + esc(t('switchHere')) + '</button><button id="swBack" class="small">' + esc(t('switchBack')) + '</button><span class="status" id="swStatus"></span></div>';
      }).catch(function (err) { $('switchList').innerHTML = '<div class="empty err">' + esc(err.message || err) + '</div>'; });
    }

    // ---- favorites
    function loadFavorites() {
      $('favList').innerHTML = '<div class="empty">…</div>';
      api('GET', '/favorites').then(function (f) {
        if (!f.ok) { $('favList').innerHTML = '<div class="empty err">' + esc(f.error) + '</div>'; return; }
        if (!f.lists.length) { $('favList').innerHTML = '<div class="empty">' + esc(t('noFavorites')) + '</div>'; return; }
        $('favList').innerHTML = f.lists.map(function (l) {
          return '<div class="miss"><span class="nm"><b>' + esc(t('fav_' + l.key) !== 'settings.fav_' + l.key ? t('fav_' + l.key) : l.key) + '</b><small>'
            + esc(t('favItems', { n: l.items }) + (l.unmatched ? ' · ' + t('favUnmatched', { n: l.unmatched }) : '')) + '</small></span></div>';
        }).join('') + '<div class="row" style="margin-top:8px"><button id="copyFav" class="small primary">' + esc(t('copyFav')) + '</button><span class="status" id="favStatus"></span></div>';
      }).catch(function (err) { $('favList').innerHTML = '<div class="empty err">' + esc(err.message || err) + '</div>'; });
    }

    // ---- dashboards
    function renderDashboards() {
      var list = data.dashboards || [];
      if (!list.length) { $('dashList').innerHTML = '<div class="empty">' + esc(t('noDashboards')) + '</div>'; return; }
      var html = list.map(function (d) {
        var st = d.issues.length ? 'r' : d.exists ? 's' : 'g';
        var lines = (d.exists ? ['<li>' + esc(t('dashExists')) + '</li>'] : []).concat(d.issues.map(function (i) { return '<li class="e">' + esc(t('issue_' + i.kind, { name: i.name })) + '</li>'; }));
        return '<div class="flow"><div class="top"><input type="checkbox" data-dash="' + esc(d.id) + '"' + (st === 'g' ? ' checked' : '') + '>'
          + '<span class="ic ' + st + '">' + { g: '✓', r: '✕', s: '=' }[st] + '</span><span class="nm"><b>' + esc(d.name) + '</b><small>' + esc(t('widgets', { n: d.widgets })) + '</small></span></div>'
          + (lines.length ? '<ul>' + lines.join('') + '</ul>' : '') + '</div>';
      }).join('');
      if (data.widgetApp) html += '<label class="chk" style="margin-top:10px"><input id="optWidgetSettings" type="checkbox" checked> <span>' + esc(t('optWidgetSettings')) + '</span></label>';
      html += '<div class="row" style="margin-top:8px"><button id="moveDash" class="small primary">' + esc(t('moveDash')) + '</button><span class="status" id="dashStatus"></span></div><ul class="result" id="dashResult"></ul>';
      $('dashList').innerHTML = html;
    }

    // ---- zones
    function renderZones() {
      var z = data.zones || { create: [], moves: [] };
      if (!z.moves.length && !z.create.length && !(z.grouped && z.grouped.length)) {
        $('zoneSummary').textContent = '';
        $('zoneList').innerHTML = '<div class="empty ok">' + esc(t('zonesOk')) + '</div>';
        return;
      }
      $('zoneSummary').textContent = t('zonesSummary', { zones: z.create.length, devices: z.moves.length + (z.grouped || []).length });
      var html = '';
      if (z.create.length) {
        html += '<h3>' + esc(t('zonesNew')) + '</h3><div class="hint">' + z.create.map(function (c) { return esc(c.path); }).join(' · ') + '</div>';
      }
      if (z.moves.length) html += '<h3>' + esc(t('zonesMove')) + '</h3><div class="row"><button class="small" id="zoneAll">' + esc(t('selectAll')) + '</button><button class="small" id="zoneNone">' + esc(t('selectNone')) + '</button></div>';
      html += z.moves.map(function (m) {
        return '<label class="miss"><input type="checkbox" data-move="' + esc(m.id) + '" checked><span class="nm"><b>' + esc(m.name) + '</b><small>'
          + esc(m.from) + ' → <b style="display:inline;color:#222">' + esc(m.to) + '</b></small></span></label>';
      }).join('');
      if (z.grouped && z.grouped.length) {
        html += '<h3>' + esc(t('zonesGrouped', { n: z.grouped.length })) + '</h3><div class="hint">' + esc(t('zonesGroupedHint')) + '</div><div class="hint">'
          + z.grouped.map(function (g) { return esc(g.name + ' → ' + g.group); }).join(' · ') + '</div>';
      }
      html += '<div class="row" style="margin-top:8px"><button id="applyZones" class="small primary">' + esc(t('zonesApply')) + '</button><span class="status" id="zoneStatus"></span></div>';
      $('zoneList').innerHTML = html;
    }

    // ---- step 2
    function renderDevices() {
      var only = $('onlyMissing').checked;
      var all = $('allDevices') && $('allDevices').checked;
      var list = data.devices.filter(function (d) { return (all || d.flows) && (!only || !d.target); });
      var inFlows = data.devices.filter(function (d) { return d.flows; }).length;
      var toggle = '<label class="chk" style="margin-top:8px"><input id="allDevices" type="checkbox"' + (all ? ' checked' : '') + '> <span>' + esc(t('allDevices', { n: data.devices.length - inFlows })) + '</span></label>';
      if (!list.length) { $('devList').innerHTML = '<div class="empty ok">' + esc(t(data.devices.length ? 'allMatched' : 'noDevices')) + '</div>' + toggle; return; }
      var byId = {};
      data.targets.forEach(function (x) { byId[x.id] = x; });
      var label = function (x) { return x.name + (x.zone ? ' (' + x.zone + ')' : ''); };
      $('devList').innerHTML = list.map(function (d) {
        var first = (d.candidates || []).map(function (id) { return byId[id]; }).filter(Boolean);
        var opts = '<option value="">' + esc(t('noTarget')) + '</option>';
        if (first.length) opts += '<optgroup label="' + esc(t('sameName')) + '">' + first.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === d.target ? ' selected' : '') + '>' + esc(label(x)) + '</option>'; }).join('') + '</optgroup><optgroup label="' + esc(t('allTargets')) + '">';
        opts += data.targets.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === d.target && !first.length ? ' selected' : '') + '>' + esc(label(x)) + '</option>'; }).join('');
        if (first.length) opts += '</optgroup>';
        var how = d.how ? t('how_' + d.how) : '';
        return '<div class="dev' + (d.target ? '' : ' missing') + '"><span class="nm"><b>' + esc(d.name) + '</b><small>'
          + esc([d.zone, d.app, d.flows ? t('usedIn', { n: d.flows }) : ''].filter(Boolean).join(' · ')) + '</small>'
          + (how ? '<small class="' + (d.target ? '' : 'warn') + '">' + esc(how) + '</small>' : '')
          + (d.otherApp && d.how !== 'link' ? '<small class="warn">' + esc(t('otherApp')) + '</small>' : '') + '</span>'
          + '<select data-src="' + esc(d.id) + '">' + opts + '</select></div>';
      }).join('') + toggle;
    }

    // ---- step 3
    function issueText(i) {
      return t('issue_' + i.kind, { name: i.name });
    }
    function renderFilters() {
      var counts = { all: data.flows.length, g: 0, o: 0, r: 0, s: 0 };
      data.flows.forEach(function (f) { counts[statusOf(f)]++; });
      $('filters').innerHTML = ['all', 'g', 'o', 'r', 's'].map(function (k) {
        return '<button class="small' + (filter === k ? ' sel' : '') + '" data-f="' + k + '">' + esc(t('filter_' + k)) + ' (' + counts[k] + ')</button>';
      }).join('');
    }
    function renderFlows() {
      renderFilters();
      var q = $('search').value.trim().toLowerCase();
      var list = data.flows.filter(function (f) {
        return (filter === 'all' || statusOf(f) === filter) && (!q || (f.name + ' ' + f.folderPath).toLowerCase().indexOf(q) >= 0);
      });
      if (!list.length) $('flowList').innerHTML = '<div class="empty">' + esc(t('noFlows')) + '</div>';
      else {
        $('flowList').innerHTML = list.map(function (f) {
          var st = statusOf(f);
          var lines = (f.exists ? ['<li>' + esc(t('exists')) + '</li>'] : [])
            .concat(f.issues.map(function (i) { return '<li class="e">' + esc(issueText(i)) + '</li>'; }))
            .concat((function () {
              // One line for all devices that are here through another app (e.g. Homey Link)
              var other = f.notes.filter(function (i) { return i.kind === 'otherApp'; });
              var rest = f.notes.filter(function (i) { return i.kind !== 'otherApp'; }).map(function (i) { return '<li class="w">' + esc(issueText(i)) + '</li>'; });
              if (other.length) rest.push('<li class="w">' + esc(t('issue_otherApps', { names: other.map(function (i) { return i.name; }).join(', ') })) + '</li>');
              return rest;
            })());
          return '<div class="flow"><div class="top"><input type="checkbox" data-flow="' + esc(f.id) + '"' + (selected[f.id] ? ' checked' : '') + '>'
            + '<span class="ic ' + st + '">' + { g: '✓', o: '!', r: '✕', s: '=' }[st] + '</span>'
            + '<span class="nm"><b>' + esc(f.name) + '</b>' + (f.kind === 'advanced' ? '<span class="tag">' + esc(t('advanced')) + '</span>' : '')
            + (f.enabled ? '' : '<span class="tag grey">' + esc(t('disabled')) + '</span>')
            + '<small>' + esc(f.folderPath || t('noFolder')) + '</small></span></div>'
            + (lines.length ? '<ul>' + lines.join('') + '</ul>' : '') + '</div>';
        }).join('');
      }
      updateButton();
    }
    function updateButton() {
      var n = Object.keys(selected).length;
      $('migrate').disabled = !n;
      $('migrate').textContent = t('migrate', { n: n });
    }

    function migrate() {
      var ids = Object.keys(selected);
      var bad = data.flows.filter(function (f) { return selected[f.id] && f.issues.length; }).length;
      var msg = t('confirm', { n: ids.length }) + (bad ? '\n\n' + t('confirmBad', { n: bad }) : '') + ($('optEnabled').checked ? '\n\n' + t('confirmEnabled') : '');
      H.confirm(msg, 'warning', function (err, yes) {
        if (err || !yes) return;
        $('migrate').disabled = true;
        $('migStatus').className = 'status';
        $('migStatus').textContent = t('migrating');
        api('POST', '/migrate', { ids: ids, keepEnabled: $('optEnabled').checked, createVariables: $('optVars').checked, skipExisting: $('optSkip').checked, bridge: $('optBridge').checked })
          .then(function (res) {
            var ok = res.filter(function (r) { return r.ok && !r.skipped && r.type !== 'variable'; }).length;
            var failed = res.filter(function (r) { return !r.ok; }).length;
            $('migStatus').className = 'status ' + (failed ? 'warn' : 'ok');
            $('migStatus').textContent = t('done', { ok: ok, failed: failed });
            $('result').innerHTML = res.map(function (r) {
              var what = r.type === 'variable' ? t('variable') : r.type === 'advanced' ? t('advanced') : t('flow');
              return '<li class="' + (r.ok ? (r.skipped ? '' : 'ok') : 'err') + '">' + esc(what + ': ' + r.name) + ' — '
                + esc(r.ok ? (r.skipped ? t('skipped') : t('created')) : r.error) + '</li>';
            }).join('');
            selected = {};
            loadMoves();
            return analyse();
          })
          .catch(function (e) {
            $('migStatus').className = 'status err';
            $('migStatus').textContent = e.message || String(e);
          })
          .then(updateButton);
      });
    }

    function onHomeyReady(Homey) {
      H = Homey;
      document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
      $('address').placeholder = t('address');
      $('token').placeholder = t('token');
      $('search').placeholder = t('search');
      $('keySteps').innerHTML = [1, 2, 3, 4].map(function (i) { return '<li>' + esc(t('key' + i)) + '</li>'; }).join('');
      $('connect').addEventListener('click', connect);
      $('linkRow').addEventListener('change', function (e) {
        if (e.target.id !== 'linkSel') return;
        var x = linkTargets.find(function (l) { return l.sessionId === e.target.value; });
        api('POST', '/link-target', { target: x });
      });
      $('switchList').addEventListener('click', function (e) {
        var boxes = [].slice.call(document.querySelectorAll('[data-move]'));
        if (e.target.id === 'swAll' || e.target.id === 'swNone') { boxes.forEach(function (b) { b.checked = e.target.id === 'swAll'; }); return; }
        if (e.target.id === 'swRefresh') return loadMoves();
        if (e.target.id !== 'swHere' && e.target.id !== 'swBack') return;
        var ids = boxes.filter(function (b) { return b.checked; }).map(function (b) { return b.getAttribute('data-move'); });
        if (!ids.length) return;
        var to = e.target.id === 'swHere' ? 'here' : 'back';
        H.confirm(t(to === 'here' ? 'switchHereConfirm' : 'switchBackConfirm', { n: ids.length }), 'warning', function (err, yes) {
          if (err || !yes) return;
          $('swStatus').textContent = t('zonesBusy');
          api('POST', '/switch', { ids: ids, to: to }).then(function (res) {
            var bad = res.filter(function (r) { return !r.ok; });
            if (bad.length) H.alert(bad.map(function (r) { return r.name + ': ' + r.error; }).join('\n'));
            loadMoves();
          }).catch(function (er) { H.alert(er.message || String(er)); });
        });
      });
      $('targetKeySteps').innerHTML = [1, 2, 3].map(function (i) { return '<li>' + esc(t('tkey' + i)) + '</li>'; }).join('');
      $('targetToken').placeholder = t('targetToken');
      $('connectTarget').addEventListener('click', function () {
        $('connectTarget').disabled = true;
        $('targetStatus').className = 'status';
        $('targetStatus').textContent = t('connecting');
        api('POST', '/connect-target', { token: $('targetToken').value }).then(function () {
          $('targetToken').value = '';
          $('targetToken').placeholder = t('tokenSaved');
          $('targetStatus').className = 'status ok';
          $('targetStatus').textContent = t('targetOk');
          hasTarget = true;
          if (data) renderMissing();
        }).catch(function (err) {
          $('targetStatus').className = 'status err';
          $('targetStatus').textContent = t('connectFailed') + ' ' + (err.message || err);
        }).then(function () { $('connectTarget').disabled = false; });
      });
      $('favList').addEventListener('click', function (e) {
        if (e.target.id !== 'copyFav') return;
        e.target.disabled = true;
        $('favStatus').textContent = t('zonesBusy');
        api('POST', '/favorites').then(function (res) {
          var bad = res.filter(function (r) { return !r.ok; });
          $('favStatus').className = 'status ' + (bad.length ? 'err' : 'ok');
          $('favStatus').textContent = bad.length ? bad.map(function (r) { return r.name + ': ' + r.error; }).join(', ') : t('favDone');
          e.target.disabled = false;
        }).catch(function (er) { H.alert(er.message || String(er)); e.target.disabled = false; });
      });
      $('dashList').addEventListener('click', function (e) {
        if (e.target.id !== 'moveDash') return;
        var ids = [].slice.call(document.querySelectorAll('[data-dash]:checked')).map(function (x) { return x.getAttribute('data-dash'); });
        var ws = $('optWidgetSettings') && $('optWidgetSettings').checked;
        if (!ids.length && !ws) return;
        e.target.disabled = true;
        $('dashStatus').textContent = t('zonesBusy');
        api('POST', '/dashboards', { ids: ids, copyWidgetSettings: ws }).then(function (res) {
          var html = res.map(function (r) { return '<li class="' + (r.ok ? 'ok' : 'err') + '">' + esc(r.name) + ' — ' + esc(r.ok ? t('created') : r.error) + '</li>'; }).join('');
          return analyse().then(function () { $('dashResult').innerHTML = html; });
        }).catch(function (er) { H.alert(er.message || String(er)); e.target.disabled = false; });
      });
      $('zoneList').addEventListener('click', function (e) {
        var boxes = [].slice.call(document.querySelectorAll('[data-move]'));
        if (e.target.id === 'zoneAll' || e.target.id === 'zoneNone') { boxes.forEach(function (b) { b.checked = e.target.id === 'zoneAll'; }); return; }
        if (e.target.id !== 'applyZones') return;
        var ids = boxes.filter(function (b) { return b.checked; }).map(function (b) { return b.getAttribute('data-move'); });
        if (!ids.length && !(data.zones && (data.zones.create.length || (data.zones.grouped || []).length))) return;
        H.confirm(t('zonesConfirm', { n: ids.length }), 'warning', function (err, yes) {
          if (err || !yes) return;
          e.target.disabled = true;
          $('zoneStatus').textContent = t('zonesBusy');
          api('POST', '/zones', { deviceIds: ids }).then(function (res) {
            var bad = res.filter(function (r) { return !r.ok; });
            var moved = res.filter(function (r) { return r.ok && !r.skipped && r.type === 'device'; }).length;
            var zones = res.filter(function (r) { return r.ok && r.type === 'zone'; }).length;
            if (bad.length) H.alert(bad.map(function (r) { return r.name + ': ' + r.error; }).join('\n'));
            return analyse().then(function () { $('zoneSummary').textContent = t('zonesDone', { zones: zones, devices: moved }); });
          }).catch(function (er) { H.alert(er.message || String(er)); e.target.disabled = false; });
        });
      });
      // With an API key of this Homey: install directly. Without it (or when that fails) open the App Store page
      function openStore(e) {
        var b = e.target.closest('[data-store]');
        if (!b) return;
        var id = b.getAttribute('data-store');
        var url = 'https://homey.app/a/' + encodeURIComponent(id) + '/';
        var open = function () { if (H.openURL) H.openURL(url); else window.open(url, '_blank'); };
        if (!hasTarget) return open();
        var label = b.textContent;
        b.disabled = true;
        b.textContent = t('installing');
        api('POST', '/install-app', { id: id, channel: b.getAttribute('data-channel') })
          .then(analyse)
          .catch(function (err) {
            b.disabled = false;
            b.textContent = label;
            H.alert(t('installFailed') + ' ' + (err.message || err) + '\n\n' + t('installFallback'));
            open();
          });
      }
      $('versionList').addEventListener('click', openStore);
      $('userList').addEventListener('click', function (e) {
        var c = e.target.closest('[data-copy]');
        if (c) {
          var url = c.getAttribute('data-copy');
          var done = function () { c.textContent = t('copied'); setTimeout(function () { c.textContent = t('copy'); }, 1500); };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function () { c.previousSibling.select(); });
          else { c.previousSibling.select(); try { document.execCommand('copy'); done(); } catch (er) { /* select only */ } }
          return;
        }
        if (e.target.id !== 'inviteUsers') return;
        var ids = [].slice.call(document.querySelectorAll('[data-user]:checked')).map(function (x) { return x.getAttribute('data-user'); });
        if (!ids.length) return;
        e.target.disabled = true;
        $('userStatus').textContent = t('creating');
        api('POST', '/invite', { ids: ids }).then(function (res) {
          var bad = res.filter(function (r) { return !r.ok; });
          if (bad.length) H.alert(bad.map(function (r) { return r.name + ': ' + r.error; }).join('\n'));
          return analyse();
        }).catch(function (er) { H.alert(er.message || String(er)); e.target.disabled = false; });
      });
      $('appList').addEventListener('change', function (e) { if (e.target.id === 'appsAll') renderMissing(); });
      $('systemList').addEventListener('click', function (e) {
        if (e.target.id !== 'createGroups') return;
        var ids = [].slice.call(document.querySelectorAll('[data-group]:checked')).map(function (x) { return x.getAttribute('data-group'); });
        if (!ids.length) return;
        e.target.disabled = true;
        $('groupStatus').textContent = t('creating');
        api('POST', '/groups', { ids: ids }).then(function (res) {
          var bad = res.filter(function (r) { return !r.ok; });
          if (bad.length) H.alert(bad.map(function (r) { return r.name + ': ' + r.error; }).join('\n'));
          return analyse();
        }).catch(function (er) { H.alert(er.message || String(er)); e.target.disabled = false; });
      });
      $('refresh').addEventListener('click', function () { api('POST', '/refresh').then(analyse); });
      $('appList').addEventListener('click', openStore);
      $('varList').addEventListener('click', function (e) {
        if (e.target.id !== 'createVars') return;
        var ids = [].slice.call(document.querySelectorAll('[data-var]:checked')).map(function (x) { return x.getAttribute('data-var'); });
        if (!ids.length) return;
        e.target.disabled = true;
        $('varStatus').textContent = t('creating');
        api('POST', '/create-variables', { ids: ids }).then(function (res) {
          var bad = res.filter(function (r) { return !r.ok; });
          if (bad.length) H.alert(bad.map(function (r) { return r.name + ': ' + r.error; }).join('\n'));
          return analyse();
        }).catch(function (err) { H.alert(err.message || String(err)); e.target.disabled = false; });
      });
      $('onlyMissing').addEventListener('change', renderDevices);
      $('devList').addEventListener('change', function (e) { if (e.target.id === 'allDevices') renderDevices(); });
      $('search').addEventListener('input', renderFlows);
      $('migrate').addEventListener('click', migrate);
      $('resetMap').addEventListener('click', function () { api('POST', '/device-map/reset').then(analyse); });
      $('devList').addEventListener('change', function (e) {
        var src = e.target.getAttribute('data-src');
        if (!src) return;
        api('POST', '/device-map', { srcId: src, dstId: e.target.value }).then(analyse);
      });
      $('filters').addEventListener('click', function (e) {
        var b = e.target.closest('[data-f]');
        if (b) { filter = b.getAttribute('data-f'); renderFlows(); }
      });
      $('flowList').addEventListener('change', function (e) {
        var id = e.target.getAttribute('data-flow');
        if (!id) return;
        if (e.target.checked) selected[id] = true; else delete selected[id];
        updateButton();
      });
      $('selectReady').addEventListener('click', function () {
        data.flows.forEach(function (f) { if (statusOf(f) === 'g' || statusOf(f) === 'o') selected[f.id] = true; });
        renderFlows();
      });
      $('selectNone').addEventListener('click', function () { selected = {}; renderFlows(); });
      updateButton();
      api('GET', '/status').then(function (s) {
        $('address').value = s.address || '';
        if (s.hasToken) $('token').placeholder = t('tokenSaved');
        hasTarget = !!s.hasTargetToken;
        if (s.hasTargetToken) { $('targetToken').placeholder = t('tokenSaved'); $('targetStatus').className = 'status ok'; $('targetStatus').textContent = t('targetOk'); }
        else { $('targetStatus').className = 'status warn'; $('targetStatus').textContent = t('targetMissing'); }
        Homey.ready();
        if (s.address && s.hasToken) {
          $('connStatus').textContent = t('connecting');
          analyse().then(function () {
            if (data) { $('connStatus').className = 'status ok'; $('connStatus').textContent = t('connectedShort'); }
            else $('connStatus').textContent = '';
          });
        }
      }).catch(function () { Homey.ready(); });
    }
  </script>
</body>
</html>
